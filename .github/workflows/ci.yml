name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Server
  rust-check:
    name: Backend Rust (Format, Lint & Check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache (accélère la compilation)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "server -> target"

      - name: Check code formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Linter (clippy)
        run: cargo clippy -- -D warnings

      - name: Build server
        run: cargo check

  # App
  flutter-check:
    name: Frontend Flutter (Analyze, Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Build Android APK (Debug build check)
        run: flutter build apk --debug